<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APEx3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #e8edf0;
    --ink: #13202b;
    --filament: #ff5a1f;
    --muted: #4d5d6a;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.6;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--filament); outline-offset: 3px; }

  header, main, footer { max-width: 960px; margin: 0 auto; padding: 0 24px; }
  header { display: flex; justify-content: space-between; align-items: center; padding-top: 24px; padding-bottom: 24px; }
  header strong { font-weight: 900; font-size: 1.1rem; }
  nav a { margin-left: 20px; text-decoration: none; font-weight: 600; }
  nav a:hover { text-decoration: underline; text-decoration-color: var(--filament); text-underline-offset: 6px; }

  .hero { padding: 72px 0 88px; }
  .hero h1 {
    margin: 0;
    font-size: clamp(3.5rem, 18vw, 10rem);
    line-height: 0.95;
    font-weight: 900;
    letter-spacing: -0.04em;
    color: transparent;
    background: repeating-linear-gradient(to bottom, var(--ink) 0 6px, var(--paper) 6px 8px);
    -webkit-background-clip: text;
    background-clip: text;
  }
  .hero p { max-width: 46ch; margin: 24px 0 32px; font-size: 1.25rem; color: var(--muted); }
  .btn {
    display: inline-block; padding: 14px 24px;
    background: var(--filament); color: var(--ink);
    font-weight: 600; text-decoration: none; border-radius: 4px;
  }
  .btn:hover { background: var(--ink); color: var(--paper); }

  section { padding: 48px 0; border-top: 2px solid var(--ink); }
  section h2 { margin: 0 0 12px; font-size: 1.75rem; font-weight: 900; }
  section p { max-width: 60ch; margin: 0; }

  footer { padding-top: 32px; padding-bottom: 48px; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
  <header>
    <strong>APEx3D</strong>
    <nav>
      <a href="#nosotros">Nosotros</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <main>
    <div class="hero">
      <h1>APEx3D</h1>
      <p>Página de prueba publicada con GitHub Pages. Aquí irá la descripción de tu proyecto.</p>
      <a class="btn" href="#contacto">Contáctanos</a>
    </div>

    <section id="nosotros">
      <h2>Sobre nosotros</h2>
      <p>Reemplaza este texto con la historia y los servicios de APEx3D.</p>
    </section>

    <section id="contacto">
      <h2>Contacto</h2>
      <p>Escríbenos a <a href="mailto:correo@ejemplo.com">correo@ejemplo.com</a>.</p>
    </section>
  </main>

  <footer>© 2026 APEx3D</footer>
</body>
</html>
